# Because of OFBIZ-10837 "Improve ObjectInputStream class."
# If you encounter a related issue (object not in the allowList),
# you must provide a complete list of objects to pass to ObjectInputStream through allowList property
# As an example, the a complete list of objects used by OFBiz OOTB is here in allowList.
# You will need to add your objects/classes to this list.

# OFBiz committers:
#     . don't forget to add new objects in SafeObjectInputStream class too (as default there).
#     . "foo" and "SerializationInjector" are used in OFBiz tests

allowList=byte\\[\\], foo, SerializationInjector, \\[Z, \\[B, \\[S, \\[I, \\[J, \\[F, \\[D, \\[C, \\[L.*, java\\.lang\\.String, java\\.lang\\.Number, java\\.lang\\.Integer, java\\.lang\\.Long, java\\.lang\\.Float, java\\.lang\\.Double, java\\.lang\\.Boolean, java\\.util\\.Locale, java\\.math\\.BigDecimal, java\\.sql\\.Timestamp, java\\.sql\\.Date, java\\.sql\\.Time, java\\.util\\.Date, java\\.util\\.ArrayList, java\\.util\\.LinkedList, java\\.util\\.Stack, java\\.util\\.Vector, java\\.util\\.TreeSet, java\\.util\\.HashSet, java\\.util\\.HashMap, java\\.util\\.Properties, java\\.util\\.Hashtable, java\\.util\\.WeakHashMap, java\\.util\\.TreeMap, java\\.util\\.Arrays\\$ArrayList, org\\.apache\\.ofbiz\\.entity\\.GenericValue, org\\.apache\\.ofbiz\\.entity\\.GenericPK, org\\.codehaus\\.groovy\\.runtime\\.GStringImpl, groovy\\.lang\\.GString

#-- List of strings rejected for serialisation
#-- The same comments than for allowList apply to denyList
denyList=rmi, <
